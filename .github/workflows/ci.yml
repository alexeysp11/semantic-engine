name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Semantic.Engine.slnx --configuration Release

      - name: Test
        run: dotnet test Semantic.Engine.slnx --configuration Release --no-build
